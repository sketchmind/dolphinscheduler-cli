name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c tools/lint-constraints.txt -e .[dev]

      - name: Prepare Runtime Bundle Sources
        if: matrix.python-version == '3.11'
        run: python tools/prepare_ds_runtime_sources.py --selection runtime-slice

      - name: Development Quality Gate
        if: matrix.python-version == '3.11'
        run: python tools/check_quality_gate.py --mode development

      - name: Cross-Python Portable Tests
        if: matrix.python-version != '3.11'
        run: python tools/check_quality_gate.py --portable --tests-only

  dependency-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            httpx-version: "0.27.0"
            pydantic-version: "2.8.0"
            pyyaml-version: "6.0"
            typer-version: "0.26.0"
          - name: current
            httpx-version: "0.28.1"
            pydantic-version: "2.13.5"
            pyyaml-version: "6.0.3"
            typer-version: "0.27.2"

    name: dependency-compatibility (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package with dependency matrix row
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c tools/lint-constraints.txt -e .[dev] \
            "httpx==${{ matrix.httpx-version }}" \
            "pydantic==${{ matrix.pydantic-version }}" \
            "PyYAML==${{ matrix.pyyaml-version }}" \
            "typer==${{ matrix.typer-version }}" \
            "click==8.5.0"

      - name: Check dependency compatibility
        env:
          PYTHONPATH: tools
        run: |
          python -m pytest -q \
            tests/test_dependency_compatibility.py \
            tests/test_cli_process.py \
            tests/test_command_catalog.py \
            tests/test_command_contract.py \
            tests/commands/test_help_metavars.py \
            tests/codegen/test_ds_request_default_types.py \
            tests/services/test_task_authoring_model_structure.py

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Check release version
        run: python tools/check_release_version.py

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Check package contents
        run: python tools/check_package_contents.py dist/*

      - name: Install wheel smoke test
        run: |
          python -m venv .package-venv
          .package-venv/bin/python -m pip install --upgrade pip
          .package-venv/bin/python -m pip install dist/*.whl
          .package-venv/bin/dsctl version
          .package-venv/bin/dsctl schema
          .package-venv/bin/dsctl capabilities
          .package-venv/bin/python - <<'PY'
          from dsctl.generated.version_profiles import TARGET_DS_VERSIONS
          from dsctl.upstream._compiled_resource import RESOURCE_PROGRAMS
          from dsctl.upstream._compiled_workflow_runtime import WORKFLOW_PROGRAMS
          from dsctl.upstream.task_type_inventory import TaskTypeAdapter
          from dsctl.upstream.wire import validate_compiled_wire_installation

          validate_compiled_wire_installation()
          for ds_version in TARGET_DS_VERSIONS:
              WORKFLOW_PROGRAMS.profile(ds_version).program("task_log")
              resource = RESOURCE_PROGRAMS.profile(ds_version)
              assert resource.program("upload").codec.file_fields == ("file",)
              assert resource.program("download").codec.response_transport == "binary"
          TaskTypeAdapter.for_version("3.4.2")
          PY
